<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PHC Lab Compliance Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 240px;
        }
        body { 
            min-height: 100vh; 
            overflow-x: hidden; /* Prevent body scroll if possible, but children should fit */
        }
        .navbar { z-index: 1030; }
        .sidebar { 
            position: fixed; 
            top: 0; 
            bottom: 0; 
            left: 0; 
            z-index: 100; 
            padding: 56px 0 0; 
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1); 
            width: var(--sidebar-width);
            background-color: #f8f9fa;
        }
        .sidebar-sticky { 
            position: relative; 
            top: 0; 
            height: calc(100vh - 56px); 
            padding-top: .5rem; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }
        .sidebar .nav-link { 
            font-weight: 500; 
            color: #333; 
            padding: 0.5rem 1rem;
            border-left: 3px solid transparent;
        }
        .sidebar .nav-link:hover { 
            background-color: #e9ecef;
        }
        .sidebar .nav-link.active { 
            color: #0d6efd; 
            background-color: #e7f1ff;
            border-left: 3px solid #0d6efd;
        }
        main {
            padding-top: 20px;
            min-width: 0; /* Critical for flex overflow */
        }
        .content-wrapper {
            min-width: 0;
            width: 100%;
        }
        @media (min-width: 768px) {
            .content-wrapper {
                padding-left: var(--sidebar-width);
                padding-top: 56px;
            }
        }
        @media (max-width: 767.98px) {
            .sidebar {
                display: none;
            }
            .content-wrapper {
                padding-top: 56px;
            }
        }
        
        /* Global Responsive Helpers */
        .responsive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            gap: 1rem;
        }
        
        .card {
            min-width: 0;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        
        .table-responsive {
            margin-bottom: 1rem;
            border: 0;
            min-width: 0;
        }
        
        .row {
            margin-left: 0;
            margin-right: 0;
        }
        .row > * {
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            min-width: 0;
        }

        .form-control, .form-select {
            min-width: 0;
        }

        /* Diagnostic Helper (visible only if debug is needed) */
        .debug-overflow * {
            outline: 1px solid rgba(255,0,0,0.1);
        }
        .debug-overflow *:hover {
            outline: 1px solid red;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark fixed-top bg-dark flex-md-nowrap p-0 shadow">
        <a class="navbar-brand col-sm-3 col-md-2 mr-0 px-3" href="/">PHC Tracker</a>
        <ul class="navbar-nav px-3">
            <li class="nav-item text-nowrap">
                {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="nav-link btn btn-link" style="color: rgba(255,255,255,.5); text-decoration: none;">Sign out</button>
                </form>
                {% endif %}
            </li>
        </ul>
    </nav>

    <div class="container-fluid p-0">
        <div class="d-flex">
            {% if user.is_authenticated %}
            <nav class="sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/indicators/' in request.path %}active{% endif %}" href="/indicators/">Indicators</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/evidence/' in request.path %}active{% endif %}" href="/evidence/">Evidence</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/registers/' in request.path %}active{% endif %}" href="/registers/">Registers</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/reports/' in request.path %}active{% endif %}" href="/reports/">Reports</a>
                        </li>
                        {% if user.is_staff %}
                        <li class="nav-item">
                            <a class="nav-link {% if '/admin/' in request.path %}active{% endif %}" href="/admin/">Admin</a>
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </nav>
            {% endif %}

            <div class="content-wrapper">
                <main role="main" class="px-3 px-md-4">
                    {% block content %}{% endblock %}
                </main>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <script>
        // Diagnostic helper for horizontal overflow
        window.findOverflow = function() {
            const all = document.querySelectorAll('*');
            for (let el of all) {
                if (el.scrollWidth > el.clientWidth) {
                    console.warn('Overflowing element found:', el);
                    el.style.outline = '2px solid red';
                    el.style.backgroundColor = 'rgba(255,0,0,0.1)';
                }
            }
        };
        // Auto-run if URL contains debug=1
        if (window.location.search.includes('debug=1')) {
            window.addEventListener('load', findOverflow);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Missing Evidence Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { font-size: 12pt; }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
        }
    </style>
</head>
<body class="bg-white p-4">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h2>Missing Evidence Report</h2>
            <p class="text-muted">Actionable list of missing requirements</p>
        </div>
        <button class="btn btn-primary no-print" onclick="window.print()">Print</button>
    </div>

    <table class="table table-bordered table-sm">
        <thead class="table-light">
            <tr>
                <th>Indicator No</th>
                <th>Requirement</th>
                <th>Type</th>
                <th>Next Action</th>
            </tr>
        </thead>
        <tbody>
            {% for req in missing_requirements|slice:":100" %}
            <tr>
                <td>{{ req.indicator.indicator_no }}</td>
                <td>{{ req.title }}</td>
                <td>{{ req.get_evidence_type_display }}</td>
                <td>Generate Document / Upload File</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

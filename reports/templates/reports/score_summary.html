<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Score Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { font-size: 12pt; }
        }
    </style>
</head>
<body class="bg-white p-4">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h2>PHC Score Summary</h2>
            <p class="text-muted">Generated: {% now "Y-m-d H:i" %}</p>
        </div>
        <button class="btn btn-primary no-print" onclick="window.print()">Print</button>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Readiness</h5>
                    <h3>{{ readiness_percent }}%</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Current Score</h5>
                    <h3>{{ current_score }}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Maximum Score</h5>
                    <h3>{{ max_score }}</h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
